<text x="56.0" y="580.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Result: [[3],[20,9],[15,7]]. The alternative (write into a pre-sized slice</text>
