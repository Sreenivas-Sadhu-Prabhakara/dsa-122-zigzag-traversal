<text x="56.0" y="342.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">[20,9]. Don't zigzag the queue itself — the traversal order stays fixed; only the</text>
